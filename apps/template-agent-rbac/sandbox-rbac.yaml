---
# The agent creates and execs into Sandboxes for its openshell_run_code
# tool. Scoped to the sandbox namespace only: no secrets, no other
# namespaces, and no permission to read anything it does not create.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-sandbox-runner
  namespace: openshell-sandboxes
  labels:
    app.kubernetes.io/name: template-agent
    owner: platform-team
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-runner
  namespace: openshell-sandboxes
  labels:
    app.kubernetes.io/name: template-agent
    owner: platform-team
subjects:
  - kind: ServiceAccount
    name: default
    namespace: template-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-sandbox-runner
