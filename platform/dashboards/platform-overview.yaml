---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-platform-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  platform-overview.json: |
    {
      "title": "Platform Overview",
      "uid": "platform-overview",
      "tags": ["platform", "kind"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": { "list": [
        { "name": "namespace", "type": "query", "datasource": {"type":"prometheus","uid":"prometheus"},
          "query": "label_values(kube_pod_info, namespace)", "includeAll": true, "multi": true, "current": {"text":"All","value":"$__all"} }
      ]},
      "panels": [
        { "type": "stat", "title": "Nodes Ready", "gridPos": {"h":4,"w":4,"x":0,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr":"sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})","refId":"A"}] },
        { "type": "stat", "title": "Pods Running", "gridPos": {"h":4,"w":4,"x":4,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr":"sum(kube_pod_status_phase{phase=\"Running\"})","refId":"A"}] },
        { "type": "stat", "title": "Pods Not Ready", "gridPos": {"h":4,"w":4,"x":8,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}}},
          "targets": [{"expr":"sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})","refId":"A"}] },
        { "type": "stat", "title": "CPU Requested / Allocatable", "gridPos": {"h":4,"w":6,"x":12,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {"defaults":{"unit":"percentunit","max":1,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":0.8},{"color":"red","value":0.95}]}}},
          "targets": [{"expr":"sum(kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"})","refId":"A"}] },
        { "type": "stat", "title": "Memory Requested / Allocatable", "gridPos": {"h":4,"w":6,"x":18,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {"defaults":{"unit":"percentunit","max":1,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":0.8},{"color":"red","value":0.95}]}}},
          "targets": [{"expr":"sum(kube_pod_container_resource_requests{resource=\"memory\"}) / sum(kube_node_status_allocatable{resource=\"memory\"})","refId":"A"}] },

        { "type": "timeseries", "title": "CPU usage by namespace (cores)", "gridPos": {"h":8,"w":12,"x":0,"y":4},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr":"sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\",namespace=~\"$namespace\"}[5m]))","legendFormat":"{{namespace}}","refId":"A"}] },
        { "type": "timeseries", "title": "Memory working set by namespace", "gridPos": {"h":8,"w":12,"x":12,"y":4},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {"defaults":{"unit":"bytes"}},
          "targets": [{"expr":"sum by (namespace) (container_memory_working_set_bytes{container!=\"\",namespace=~\"$namespace\"})","legendFormat":"{{namespace}}","refId":"A"}] },

        { "type": "timeseries", "title": "Ingress requests/sec by host", "gridPos": {"h":8,"w":12,"x":0,"y":12},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr":"sum by (host) (rate(nginx_ingress_controller_requests[5m]))","legendFormat":"{{host}}","refId":"A"}] },
        { "type": "timeseries", "title": "Ingress p95 latency", "gridPos": {"h":8,"w":12,"x":12,"y":12},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {"defaults":{"unit":"s"}},
          "targets": [{"expr":"histogram_quantile(0.95, sum by (le, host) (rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])))","legendFormat":"{{host}}","refId":"A"}] },

        { "type": "timeseries", "title": "Container restarts (1h)", "gridPos": {"h":8,"w":12,"x":0,"y":20},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr":"sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h])) > 0","legendFormat":"{{namespace}}/{{pod}}","refId":"A"}] },
        { "type": "timeseries", "title": "Log lines/sec by namespace", "gridPos": {"h":8,"w":12,"x":12,"y":20},
          "datasource": {"type":"loki","uid":"loki"},
          "targets": [{"expr":"sum by (namespace) (rate({namespace=~\".+\"}[5m]))","legendFormat":"{{namespace}}","refId":"A"}] },

        { "type": "logs", "title": "Recent warnings and errors", "gridPos": {"h":10,"w":24,"x":0,"y":28},
          "datasource": {"type":"loki","uid":"loki"},
          "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending"},
          "targets": [{"expr":"{namespace=~\"$namespace\"} |~ \"(?i)(error|fatal|panic|exception)\"","refId":"A"}] }
      ],
      "schemaVersion": 39,
      "version": 1
    }
