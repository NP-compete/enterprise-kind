---
# Enterprise-style API audit policy: noisy read paths dropped, writes recorded with
# request bodies, secret/token payloads reduced to metadata only.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived

rules:
  # Never log the content of credential-bearing objects.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
      - group: "authentication.k8s.io"
        resources: ["tokenreviews"]

  # Drop high-volume, low-value chatter.
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
    resources:
      - group: ""
        resources: ["endpoints", "services"]
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get", "list", "watch"]
  - level: None
    users:
      - system:kube-controller-manager
      - system:kube-scheduler
      - system:serviceaccount:kube-system:endpoint-controller
    verbs: ["get", "list", "watch", "update"]
    resources:
      - group: ""
        resources: ["endpoints", "events", "leases"]
      - group: "coordination.k8s.io"
        resources: ["leases"]
  - level: None
    nonResourceURLs:
      - /healthz*
      - /livez*
      - /readyz*
      - /version
      - /metrics
      - /openapi*
      - /swagger*

  # Anything that changes RBAC or policy: full fidelity.
  - level: RequestResponse
    resources:
      - group: "rbac.authorization.k8s.io"
      - group: "policy"
      - group: "admissionregistration.k8s.io"
      - group: "certificates.k8s.io"
      - group: "kyverno.io"

  # Exec / attach / port-forward into pods is always interesting.
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/eviction"]

  # All other writes: record the submitted object.
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]

  # Everything else: one line of metadata.
  - level: Metadata
