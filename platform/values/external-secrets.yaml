---
# External Secrets Operator syncs secrets out of Vault into Kubernetes Secrets,
# so workloads consume ordinary Secrets and Vault stays the source of truth.
installCRDs: true
replicaCount: 1
priorityClassName: platform-high
resources:
  requests: { cpu: 20m, memory: 96Mi }
  limits: { memory: 384Mi }
webhook:
  replicaCount: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
certController:
  replicaCount: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
serviceMonitor:
  enabled: false
