---
# Grafana Alloy is the single collector: it tails every pod's logs into Loki,
# ships Kubernetes events, and terminates OTLP (traces -> Tempo, metrics ->
# Prometheus remote-write, logs -> Loki OTLP).
controller:
  type: daemonset
  # The audit log only exists on control-plane nodes, so Alloy has to run there
  # too in order to tail it.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    extra:
      - name: audit-log
        hostPath:
          path: /var/log/kubernetes
          type: DirectoryOrCreate
  podAnnotations:
    prometheus.io/scrape: "false"

rbac:
  create: true

serviceMonitor:
  enabled: true

alloy:
  clustering:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  # The chart's key is alloy.mounts.extra, not extraVolumeMounts -- with the
  # wrong key the volume is created but never mounted, and the audit file is
  # simply absent inside the container.
  mounts:
    extra:
      - name: audit-log
        mountPath: /var/log/kubernetes
        readOnly: true
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      // ---------- pod logs ----------
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "__host__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
        // Only tail pods scheduled on this node.
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = sys.env("NODE_NAME")
          action        = "keep"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        forward_to = [loki.write.default.receiver]

        // Pull trace_id out of JSON logs so Grafana can jump log -> trace.
        stage.json {
          expressions = { trace_id = "trace_id", level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        stage.structured_metadata {
          values = { trace_id = "" }
        }
      }

      // ---------- API server audit log ----------
      // Only present on control-plane nodes; the matcher simply finds nothing
      // on workers rather than erroring.
      local.file_match "audit" {
        path_targets = [{
          __path__ = "/var/log/kubernetes/audit.log",
          job      = "kubernetes-audit",
          node     = sys.env("NODE_NAME"),
        }]
      }

      loki.source.file "audit" {
        targets    = local.file_match.audit.targets
        forward_to = [loki.process.audit.receiver]
      }

      loki.process "audit" {
        forward_to = [loki.write.default.receiver]
        // Audit entries are JSON; lift the fields worth querying on.
        stage.json {
          expressions = {
            verb       = "verb",
            user       = "user.username",
            resource   = "objectRef.resource",
            namespace  = "objectRef.namespace",
            // JMESPath quotes special-character keys with dotted syntax,
            // not brackets: annotations."a/b" rather than annotations["a/b"].
            decision   = "annotations.\"authorization.k8s.io/decision\"",
          }
        }
        stage.labels {
          values = { verb = "", decision = "" }
        }
      }

      // ---------- cluster events ----------
      loki.source.kubernetes_events "events" {
        job_name   = "kubernetes-events"
        log_format = "logfmt"
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
        external_labels = {
          cluster = "${CLUSTER_NAME}",
        }
      }

      // ---------- OTLP ingest ----------
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }

        output {
          traces  = [otelcol.processor.k8sattributes.default.input]
          metrics = [otelcol.processor.k8sattributes.default.input]
          logs    = [otelcol.processor.k8sattributes.default.input]
        }
      }

      otelcol.processor.k8sattributes "default" {
        extract {
          metadata = [
            "k8s.namespace.name",
            "k8s.pod.name",
            "k8s.deployment.name",
            "k8s.node.name",
          ]
        }
        output {
          traces  = [otelcol.processor.batch.default.input]
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          traces  = [otelcol.exporter.otlp.tempo.input]
          metrics = [otelcol.exporter.prometheus.default.input]
          logs    = [otelcol.exporter.otlphttp.loki.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.observability.svc.cluster.local:4317"
          tls { insecure = true }
        }
      }

      otelcol.exporter.otlphttp "loki" {
        client {
          endpoint = "http://loki-gateway.observability.svc.cluster.local/otlp"
        }
      }

      otelcol.exporter.prometheus "default" {
        forward_to = [prometheus.remote_write.default.receiver]
      }

      prometheus.remote_write "default" {
        endpoint {
          url = "http://kps-prometheus.observability.svc.cluster.local:9090/api/v1/write"
        }
      }
