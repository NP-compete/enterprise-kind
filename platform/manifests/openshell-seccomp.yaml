---
# The installer below needs hostPath to reach the kubelet's seccomp
# directory, and the cluster-wide PodSecurity default (baseline) forbids it.
# Velero's node-agent needs the same thing and gets the same exemption.
#
# It gets its own namespace rather than relaxing ns/openshell: the gateway
# keeps running under the default policy, and the only thing privileged
# here is a pod that writes one file and sleeps.
apiVersion: v1
kind: Namespace
metadata:
  name: openshell-seccomp
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
    platform.kind.local/component: sandboxing
    app.kubernetes.io/name: openshell-seccomp
    owner: platform-team
---
# Lets OpenShell's gateway-provisioned sandboxes start.
#
# The supervisor calls unshare(CLONE_NEWUSER) to build the sandbox it puts
# the workload in. containerd's RuntimeDefault seccomp profile allows
# clone/clone3/unshare only to containers holding CAP_SYS_ADMIN -- and the
# sandbox pods hold no capabilities at all -- so the call returns EPERM and
# the supervisor dies with "failed to spawn sandbox entrypoint process:
# Permission denied". Measured, not guessed: the same pod under an
# Unconfined profile makes the call successfully, and Landlock and seccomp
# user-notification work under either profile.
#
# The chart hardcodes RuntimeDefault on sandbox pods and exposes no value
# to change it, so Kyverno mutates them on the way in. The profile itself
# is the upstream default plus exactly three rules (see
# platform/seccomp/openshell-userns.json), which keeps mount, bpf, setns and
# perf_event_open gated behind CAP_SYS_ADMIN as they are by default.
#
# Localhost rather than Unconfined on purpose: PodSecurity "baseline" is
# enforced in openshell-sandboxes and forbids Unconfined, but permits a
# named profile. The namespace keeps its policy level.
#
# The installer runs in its own namespace, not in openshell-sandboxes: the
# component that relaxes a policy has no business living inside the
# namespace it relaxes it for.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshell-seccomp-profile
  namespace: openshell-seccomp
  labels:
    app.kubernetes.io/name: openshell
    owner: platform-team
data:
