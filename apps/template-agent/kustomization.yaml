apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: template-agent

# Upstream's kind overlay, rendered at a pinned commit and vendored into
# upstream.yaml. A remote base would make every apply depend on github.com
# resolving, which is not a dependency a local platform should have.
#   template-agent 75072aeb0825553dd04af7c21a2e21d063797ae9
#   template-ui    7a037b5fec170573c77a81db48a3c81a57d6c2d0 (image only)
resources:
  - upstream.yaml
  - ui-sealedsecret.yaml
  - patch/sandbox-rbac.yaml
  - patch/sandbox-netpol.yaml
  - google-creds-sealedsecret.yaml

# The agent image ships an EMPTY /app/config/agent: the Containerfile sets
# CONFIG_PATH but never copies config in, and upstream's kind overlay never
# mounts it, so the agent exits with "Missing required config files". The
# config tree is nested, which ConfigMap keys cannot represent, so it is
# baked into an image layer instead -- which also versions config with code.
images:
  - name: localhost/template-agent
    newTag: local-config

patches:
  # The UI reads REDIS_HOST from agent-config, but nothing in the upstream
  # overlay defines it -- the redis component supplies REDIS_URL only. Without
  # this the UI never leaves CreateContainerConfigError.
  - target: { kind: ConfigMap, name: agent-config }
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: agent-config }
      data:
        REDIS_HOST: redis
        REDIS_PORT: "6379"

  # --- eval-runner removed -------------------------------------------------
  # Its image is `eval-runner:latest`, which the enforcing disallow-latest-tag
  # policy rejects at admission, and nothing builds that image here. It is an
  # evaluation harness, not part of serving the agent. Build and pin it if you
  # want promptfoo evals in-cluster.
  - target: { kind: Deployment, name: eval-runner }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: eval-runner }
  - target: { kind: Service, name: eval-runner }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: eval-runner }
  - target: { kind: ConfigMap, name: eval-runner-config }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: eval-runner-config }
  - target: { kind: NetworkPolicy, name: eval-runner-internal-only }
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: eval-runner-internal-only }

  # --- hostnames -----------------------------------------------------------
  # Upstream uses *.localhost. This platform deliberately does not: Go and
  # musl resolve any name ending in .localhost to loopback without consulting
  # DNS (RFC 6761), so in-cluster calls would dial themselves. Everything here
  # lives under .kind.test, which CoreDNS and /etc/hosts already route.
  - target: { kind: Ingress, name: template-agent-ingress }
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: template-agent-ingress
        annotations:
          cert-manager.io/cluster-issuer: platform-ca
      spec:
        ingressClassName: nginx
        tls:
          - secretName: template-agent-tls
            hosts: [agent-ui.kind.test, agent.kind.test, jaeger.kind.test]
        rules:
          - host: agent-ui.kind.test
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend: { service: { name: ui, port: { number: 8080 } } }
          - host: agent.kind.test
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend: { service: { name: agent, port: { number: 5002 } } }

  # --- hardening -----------------------------------------------------------
  # add-default-securitycontext is Audit here, so these would be admitted
  # as-is. Set explicitly anyway: the policy exists to describe what good
  # looks like, and a workload that only passes because the rule is advisory
  # is a workload that breaks the day it is enforced.
  - target: { kind: Deployment, name: agent }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: agent }
      spec:
        template:
          spec:
            containers:
              - name: agent
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
  - target: { kind: Deployment, name: ui }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: ui }
      spec:
        template:
          spec:
            containers:
              - name: ui
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }

  # --- pgvector and redis run as root ---------------------------------------
  # Both components set runAsNonRoot: true but their images start as root and
  # step down internally, so the kubelet refuses them outright:
  #   "container has runAsNonRoot and image will run as root"
  # Pinning the UID the images actually use satisfies the check, and fsGroup
  # gives them ownership of the PVC they write to.
  - target: { kind: Deployment, name: pgvector }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: pgvector }
      spec:
        template:
          spec:
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              fsGroup: 999
              runAsNonRoot: true
  - target: { kind: Deployment, name: redis }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: redis }
      spec:
        template:
          spec:
            securityContext:
              runAsUser: 999
              runAsGroup: 1000
              fsGroup: 1000
              runAsNonRoot: true

  # --- UI session signing key -----------------------------------------------
  # The UI refuses to start without COOKIE_SIGN (>=32 chars), and nothing in
  # upstream's overlay supplies it -- it appears only in template-ui's
  # env.template. Generated per install into the ui-secrets Secret by
  # scripts/ops.sh agent-stack, never committed.
  - target: { kind: Deployment, name: ui }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: ui }
      spec:
        template:
          spec:
            containers:
              - name: ui
                env:
                  - name: COOKIE_SIGN
                    valueFrom:
                      secretKeyRef: { name: ui-secrets, key: COOKIE_SIGN }

  # --- agent memory ----------------------------------------------------------
  # Upstream caps the agent at 512Mi and it is OOMKilled (exit 137) during
  # startup, after config load but before the health endpoint comes up: it
  # imports langgraph plus the whole model stack. Measured steady state is
  # ~560Mi, so 1Gi limit leaves headroom without the 3x overshoot.
  - target: { kind: Deployment, name: agent }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: agent }
      spec:
        template:
          spec:
            containers:
              - name: agent
                resources:
                  requests: { cpu: 100m, memory: 512Mi }
                  limits: { cpu: "1", memory: 1Gi }

  # --- SSO ------------------------------------------------------------------
  # The agent defaults ENABLE_AUTH=true and rejects every request with 401
  # when SSO is unset; the UI surfaces that as "Session Expired". Both sides
  # are pointed at the platform's Keycloak realm. The client secret is NOT
  # here -- it comes from the sealed ui-secrets Secret.
  - target: { kind: Deployment, name: agent }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: agent }
      spec:
        template:
          spec:
            containers:
              - name: agent
                env:
                  - name: ENABLE_AUTH
                    value: "true"
                  - name: SSO_ISSUER_URL
                    value: https://keycloak.kind.test/realms/platform
                  - name: SSO_CLIENT_ID
                    value: template-agent
                  - name: SSO_JWT_AUDIENCE
                    value: template-agent
                  - name: SSO_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef: { name: ui-secrets, key: SSO_CLIENT_SECRET }
                  # A COMBINED bundle: the image's 118 public CAs plus the
                  # platform CA, built by the init container below.
                  #
                  # Pointing these at the platform CA alone replaces the
                  # system trust store rather than extending it -- OIDC
                  # against Keycloak then works while every public endpoint
                  # fails, which shows up as the agent being unable to reach
                  # oauth2.googleapis.com to mint a Vertex token.
                  - name: SSL_CERT_FILE
                    value: /etc/ssl/combined/ca-bundle.crt
                  - name: REQUESTS_CA_BUNDLE
                    value: /etc/ssl/combined/ca-bundle.crt
                volumeMounts:
                  - name: platform-ca
                    mountPath: /etc/platform-ca
                    readOnly: true
                  - name: ca-combined
                    mountPath: /etc/ssl/combined
                    readOnly: true
            initContainers:
              - name: ca-bundle
                image: localhost/template-agent:local-config
                imagePullPolicy: Never
                command: ["sh","-c"]
                args:
                  - cat /etc/ssl/certs/ca-certificates.crt /etc/platform-ca/ca.crt
                    > /work/ca-bundle.crt
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { memory: 128Mi }
                volumeMounts:
                  - { name: ca-combined, mountPath: /work }
                  - { name: platform-ca, mountPath: /etc/platform-ca, readOnly: true }
            volumes:
              - name: platform-ca
                configMap: { name: platform-ca }
              - name: ca-combined
                emptyDir: {}
  - target: { kind: Deployment, name: ui }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: ui }
      spec:
        template:
          spec:
            containers:
              - name: ui
                env:
                  - name: AUTH_ENABLED
                    value: "true"
                  - name: SSO_ISSUER_HOST
                    value: https://keycloak.kind.test/realms/platform
                  - name: SSO_CLIENT_ID
                    value: template-agent
                  - name: SSO_CALLBACK_URL
                    value: https://agent-ui.kind.test/auth/callback/oidc
                  - name: SSO_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef: { name: ui-secrets, key: SSO_CLIENT_SECRET }
                  - name: NODE_EXTRA_CA_CERTS
                    value: /etc/platform-ca/ca.crt
                volumeMounts:
                  - name: platform-ca
                    mountPath: /etc/platform-ca
                    readOnly: true
            volumes:
              - name: platform-ca
                configMap: { name: platform-ca }

  # --- Vertex AI credentials -------------------------------------------------
  # The agent's default model is gemini-3.1-pro-preview, which needs Google
  # credentials; without them every thread-state call 500s and the UI shows
  # "Reconnecting...". The service account JSON is held in its own sealed
  # secret rather than agent-secrets, because agent-secrets is vendored from
  # upstream and would be overwritten on the next regenerate.
  #
  # Populate with:  make agent-creds FILE=/path/to/service-account.json
  - target: { kind: Deployment, name: agent }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: agent }
      spec:
        template:
          spec:
            containers:
              - name: agent
                env:
                  - name: GOOGLE_APPLICATION_CREDENTIALS_CONTENT
                    valueFrom:
                      secretKeyRef:
                        name: agent-google-creds
                        key: credentials.json
                        optional: true
  # --- UI rate limit ---------------------------------------------------------
  # Upstream ships 100 requests/minute, which the chat UI exhausts quickly
  # once a conversation is streaming. The whole ConfigMap value has to be
  # restated: ui.yaml is a single string key, and kustomize cannot patch
  # inside it.
  - target: { kind: ConfigMap, name: ui-config }
    patch: |
      {
        "apiVersion": "v1",
        "kind": "ConfigMap",
        "metadata": {
          "name": "ui-config"
        },
        "data": {
          "ui.yaml": "server:\n  host: \"0.0.0.0\"\n  port: 8080\n  body_limit: 1048576\nlogging:\n  level: info\ncors:\n  origin: \"http://localhost:5173\"\nsecurity:\n  helmet:\n    enabled: true\n    csp:\n      default_src: [\"'self'\"]\n      script_src: [\"'self'\", \"'unsafe-inline'\"]\n      style_src: [\"'self'\", \"'unsafe-inline'\"]\n      img_src: [\"'self'\", \"data:\", \"blob:\"]\n      connect_src: [\"'self'\"]\n      font_src: [\"'self'\"]\n      object_src: [\"'none'\"]\n      frame_ancestors: [\"'none'\"]\n    cross_origin_embedder_policy: false\n  rate_limit:\n    enabled: true\n    max: 20000\n    window: \"1 minute\"\n    exclude_paths:\n      - \"/api/health\"\n      - \"/_health\"\n  session:\n    secure_cookie: false\n    max_age_days: 30\notel:\n  enabled: false\n  service_name: \"template-ui\"\nannouncement:\n  enabled: false\n  message: \"\"\n  type: info\n"
        }
      }

  # --- observability --------------------------------------------------------
  # The agent emits OTLP but nothing told it where to send it, so traces and
  # metrics went nowhere while only its stdout reached Loki. Alloy already
  # terminates OTLP on 4317 and fans out: traces to Tempo, metrics to
  # Prometheus, logs to Loki. Pointing the agent at Alloy puts it in the same
  # pipeline as every other component rather than leaving it a blind spot.
  - target: { kind: Deployment, name: agent }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: agent }
      spec:
        template:
          spec:
            containers:
              - name: agent
                env:
                  # ENABLE_OTEL is the master switch and defaults off --
                  # setting only OTEL_EXPORTER_OTLP_ENDPOINT configures an
                  # exporter that is never started, which looks exactly like
                  # a broken collector.
                  - name: ENABLE_OTEL
                    value: "true"
                  - name: ENABLE_OTEL_METRICS
                    value: "true"
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: http://alloy.observability.svc.cluster.local:4317
                  - name: OTEL_EXPORTER_OTLP_INSECURE
                    value: "true"
                  - name: OTEL_SERVICE_NAME
                    value: template-agent
                  - name: OTEL_METRICS
                    value: "true"
                  - name: OTEL_METRIC_EXPORT_INTERVAL
                    value: "30000"
