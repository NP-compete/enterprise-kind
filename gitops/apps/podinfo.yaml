---
# Example child application: the reference workload, managed by Argo CD instead
# of `make demo`. Add one file per application under gitops/apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Literal: Argo CD reads child Applications straight from git, where
    # nothing expands ${GITOPS_REPO}. Only root-app.yaml is rendered locally.
    repoURL: https://github.com/NP-compete/enterprise-kind.git
    targetRevision: HEAD
    path: apps/podinfo
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas # owned by the HPA
