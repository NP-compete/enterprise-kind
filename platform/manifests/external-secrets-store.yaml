---
# How External Secrets reaches Vault. Authentication is via the Kubernetes
# ServiceAccount token -- no static Vault token is stored anywhere.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Proof the whole path works, checked by the smoke suite: this Secret exists
# only because ESO fetched it from Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-canary
  namespace: external-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vault-canary
    creationPolicy: Owner
  data:
    - secretKey: registry-username
      remoteRef:
        key: registry
        property: username
