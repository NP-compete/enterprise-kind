---
# Somewhere for alerts to actually go.
#
# Alertmanager with no receiver silently drops every alert, which makes the
# whole alerting path untestable. This is a tiny webhook that logs each alert
# as one JSON line; Alloy ships those logs to Loki, so firing alerts become
# queryable in Grafana:
#
#   {namespace="observability", app="alert-sink"} | json
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-sink
  namespace: observability
data:
  sink.py: |
    """Log every Alertmanager webhook delivery as one JSON line per alert."""
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            raw = self.rfile.read(length) if length else b"{}"
            try:
                payload = json.loads(raw)
            except json.JSONDecodeError:
                payload = {"error": "undecodable payload", "raw": raw[:500].decode("utf-8", "replace")}
            for alert in payload.get("alerts", [payload]):
                labels = alert.get("labels", {})
                print(json.dumps({
                    "level": "warn" if alert.get("status") == "firing" else "info",
                    "status": alert.get("status"),
                    "alertname": labels.get("alertname"),
                    "severity": labels.get("severity"),
                    "namespace": labels.get("namespace"),
                    "summary": alert.get("annotations", {}).get("summary"),
                    "startsAt": alert.get("startsAt"),
                }), flush=True)
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def do_GET(self):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"alert-sink ready")

        def log_message(self, *_):
            pass  # the JSON lines above are the log

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: observability
  labels:
    app.kubernetes.io/name: alert-sink
    owner: platform-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-sink
        app: alert-sink
    spec:
      priorityClassName: platform-high
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sink
          image: docker.io/library/python:3.12-alpine
          command: ["python3", "/app/sink.py"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
      volumes:
        - name: app
          configMap:
            name: alert-sink
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: observability
  labels:
    app.kubernetes.io/name: alert-sink
spec:
  selector:
    app.kubernetes.io/name: alert-sink
  ports:
    - name: http
      port: 80
      targetPort: http
