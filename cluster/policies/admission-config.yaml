---
# Cluster-wide Pod Security Standards default.
#   enforce=baseline  -> blocks the obviously dangerous (privileged, hostPID/IPC, hostNet)
#   warn/audit=restricted -> tells you what would fail a real hardened cluster
# Platform namespaces that legitimately need host access are exempted; application
# namespaces created by scripts/platform-install.sh are pinned to `restricted` via labels.
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: "baseline"
        enforce-version: "latest"
        audit: "restricted"
        audit-version: "latest"
        warn: "restricted"
        warn-version: "latest"
      exemptions:
        usernames: []
        runtimeClasses: []
        namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - local-path-storage
          - ingress-nginx
          - tigera-operator
          - calico-system
          - calico-apiserver
          - observability
          - kyverno
          - cert-manager
