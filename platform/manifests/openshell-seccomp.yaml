apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: openshell-seccomp-installer
  namespace: openshell-seccomp
  labels:
    app.kubernetes.io/name: openshell-seccomp-installer
    owner: platform-team
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell-seccomp-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell-seccomp-installer
        owner: platform-team
    spec:
      # A localhostProfile is resolved by the kubelet against its own
      # --root-dir/seccomp, so the file has to exist on the node before any
      # pod references it. A DaemonSet is the only way to put it there that
      # survives a node being recreated.
      hostPID: false
      tolerations:
        - operator: Exists
      containers:
        - name: installer
          image: registry.access.redhat.com/hi/python:3.14-builder
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              install -D -m 0644 /profile/openshell-userns.json \
                /host-seccomp/openshell-userns.json
              echo "installed $(wc -c < /host-seccomp/openshell-userns.json) bytes"
              # Stay alive so the DaemonSet reports Ready and a node that
              # rejoins gets the file again on restart.
              exec sleep infinity
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: host-seccomp
              mountPath: /host-seccomp
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            # Writing into the kubelet's directory needs root on the node;
            # it does not need any capability beyond file ownership.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: profile
          configMap:
            name: openshell-seccomp-profile
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: openshell-sandbox-seccomp
  annotations:
    policies.kyverno.io/title: Allow user namespaces in OpenShell sandboxes
    policies.kyverno.io/subject: Pod
spec:
  # Mutation only; nothing is rejected by this policy.
  rules:
    - name: use-userns-seccomp-profile
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [openshell-sandboxes]
      mutate:
