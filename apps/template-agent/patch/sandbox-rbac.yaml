---
# The agent creates and execs into Sandboxes for the OpenShell backend
# behind its execute and file tools. Namespaced to template-agent, where
# the sandboxes now run: no secrets, no other namespaces, nothing beyond
# what the backend needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-sandbox-runner
  labels:
    app.kubernetes.io/name: template-agent
    owner: platform-team
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # Both verbs. The Python client calls connect_get_namespaced_pod_exec,
    # which issues a GET before upgrading to a websocket, so `create` alone
    # fails with "cannot get resource pods/exec" -- kubectl's own exec uses
    # POST, which is why `auth can-i create pods --subresource=exec` says
    # yes while the client is still refused.
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-runner
  labels:
    app.kubernetes.io/name: template-agent
    owner: platform-team
subjects:
  - kind: ServiceAccount
    name: default
    namespace: template-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-sandbox-runner
