---
# Single-binary Tempo with OTLP ingest and the span-metrics connector feeding
# Prometheus (powers Grafana's service graph / RED metrics).
fullnameOverride: tempo

tempo:
  repository: grafana/tempo
  retention: 72h
  storage:
    trace:
      # Object storage, so traces survive losing the node Tempo runs on.
      backend: s3
      s3:
        bucket: tempo
        endpoint: s3.storage.svc.cluster.local:8333
        access_key: ${S3_ACCESS_KEY}
        secret_key: ${S3_SECRET_KEY}
        insecure: true
        forcepathstyle: true
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
        grpc:
          endpoint: 0.0.0.0:14250
    zipkin:
      endpoint: 0.0.0.0:9411
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kps-prometheus.observability.svc.cluster.local:9090/api/v1/write
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

persistence:
  enabled: true
  storageClassName: standard
  size: 10Gi

serviceMonitor:
  enabled: false # flipped on after the Prometheus CRDs exist
