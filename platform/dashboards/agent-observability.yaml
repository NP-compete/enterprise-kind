---
# Logs, metrics and traces for the template-agent stack, in one place.
#
# Panel choice follows the data's job, not habit: current values are stat
# tiles rather than charts, latency quantiles share one axis because they
# share a unit, and log volume is stacked bars because it is a count over
# time. No dual-axis panels.
#
# Every query was checked against live data before being committed -- the
# agent exports its own domain metrics (time to first token, conversation
# duration, graph build time) alongside the generic HTTP ones, and those
# are the interesting half.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-agent-observability
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Agent"
data:
  agent-observability.json: |
    {
      "uid": "agent-observability",
      "title": "Agent \u2014 logs, metrics and traces",
      "tags": [
        "agent",
        "observability"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Active conversations",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "no data yet"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "health_assistant_active_conversations",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Conversations (1h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "no data yet"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(health_assistant_conversations_total[1h])",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "In-flight HTTP requests",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "no data yet"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(http_server_active_requests)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p95 time to first token",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "no data yet"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(health_assistant_time_to_first_token_seconds_bucket[15m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP request latency",
          "description": "Quantiles over all routes. One axis: every series is seconds.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "axisLabel": "latency"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "p50",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))"
            },
            {
              "refId": "B",
              "legendFormat": "p95",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))"
            },
            {
              "refId": "C",
              "legendFormat": "p99",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Agent phase durations (p95)",
          "description": "Where a turn spends its time: building the graph, first token, the full conversation.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "axisLabel": "duration"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "graph build",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(health_assistant_graph_build_duration_seconds_bucket[5m])))"
            },
            {
              "refId": "B",
              "legendFormat": "time to first token",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(health_assistant_time_to_first_token_seconds_bucket[5m])))"
            },
            {
              "refId": "C",
              "legendFormat": "conversation",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(health_assistant_conversation_duration_seconds_bucket[5m])))"
            }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Recent traces",
          "description": "Click a trace to open it. Trace -> logs and trace -> metrics are wired on the datasource.",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceqlSearch",
              "limit": 20,
              "filters": [
                {
                  "id": "service",
                  "tag": "service.name",
                  "operator": "=",
                  "scope": "resource",
                  "value": [
                    "Health Assistant"
                  ],
                  "valueType": "string"
                }
              ]
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Request rate by route",
          "description": "Which endpoints are actually being used.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "axisLabel": "requests/sec"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{http_route}}",
              "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count[5m]))"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Log volume by level",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 21
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 70,
                "stacking": {
                  "mode": "normal"
                },
                "axisLabel": "lines/sec"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{detected_level}}",
              "expr": "sum by (detected_level) (rate({namespace=\"template-agent\"}[5m]))"
            }
          ]
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Agent logs",
          "description": "A trace_id in a line links straight to its trace.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 6,
            "w": 16,
            "x": 8,
            "y": 21
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"template-agent\", container=~\"agent|ui\"}"
            }
          ]
        },
        {
          "id": 11,
          "type": "table",
          "title": "OpenShell runs",
          "description": "One row per completed sandbox command, including the ones the filesystem tools issue on the agent's behalf. The sandbox pod cannot provide these: its container runs sleep and commands are delivered over exec, whose output never reaches pod stdout. The backend emits them itself.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "duration_s"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "custom.width",
                    "value": 110
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "run_id"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 210
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "status"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "queryType": "range",
              "expr": "{namespace=\"template-agent\", container=\"agent\"} |= \"openshell_run_finished\" | json",
              "maxLines": 200
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "Line",
                "format": "json"
              }
            },
            {
              "id": "organize",
              "options": {
                "includeByName": {
                  "Time": true,
                  "run_id": true,
                  "exit_code": true,
                  "status": true,
                  "duration_s": true,
                  "output_preview": true,
                  "error": true
                },
                "indexByName": {
                  "Time": 0,
                  "run_id": 1,
                  "exit_code": 2,
                  "status": 3,
                  "duration_s": 4,
                  "output_preview": 5,
                  "error": 6
                }
              }
            }
          ]
        },
        {
          "id": 12,
          "type": "logs",
          "title": "OpenShell run log (filter by run id)",
          "description": "Both events for each run. Set the run_id variable to isolate one.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "prettifyLogMessage": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"template-agent\", container=\"agent\"} |= \"openshell_run\" | json | run_id =~ \"$run_id\""
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "run_id",
            "label": "Run",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "",
              "stream": "{namespace=\"template-agent\", container=\"agent\"} |= \"openshell_run_finished\" | json",
              "type": 1,
              "refId": "run_id"
            },
            "definition": "run_id",
            "includeAll": true,
            "allValue": ".*",
            "multi": false,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "links": [
        {
          "title": "Explore traces",
          "type": "link",
          "url": "/explore?left=%7B%22datasource%22:%22tempo%22%7D",
          "icon": "external link"
        }
      ]
    }
