apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deliberately a separate path with NO `namespace:` transformer.
#
# These bind the agent's ServiceAccount into openshell-sandboxes. Kept in
# apps/template-agent they were silently rewritten into template-agent by
# that kustomization's `namespace: template-agent`, which applies to every
# namespaced resource and has no per-resource opt-out. The agent then had
# no permission to create sandboxes and the binding looked present.
resources:
  - sandbox-rbac.yaml
  - sandbox-netpol.yaml
