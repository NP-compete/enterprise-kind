---
# Keycloak 26 as the cluster's identity provider. The `platform` realm is
# imported declaratively from platform/manifests/keycloak-realm.json, so the
# whole SSO configuration lives in git, not in a database someone clicked at.
image:
  repository: quay.io/keycloak/keycloak
  tag: "26.8.1"

replicas: 1
# Satisfies the require-ownership-labels policy.
statefulsetLabels:
  owner: platform-team
  app.kubernetes.io/name: keycloak

# `--import-realm` only runs at startup, so a changed realm file must roll the
# pod. Without this the realm silently stays on the previously imported version.
podAnnotations:
  platform.kind.local/realm-checksum: "${REALM_CHECKSUM}"

command:
  - /opt/keycloak/bin/kc.sh
args:
  - start
  - --import-realm
  # Single replica: `local` skips the JGroups stack entirely.
  - --cache=local

http:
  relativePath: "/"

proxy:
  enabled: true
  mode: forwarded
  http:
    enabled: true

database:
  vendor: postgres
  # CloudNativePG's read-write Service. It follows the primary across a
  # failover, so Keycloak never has to be told which pod is currently primary.
  hostname: platform-pg-rw.identity.svc.cluster.local
  port: 5432
  database: keycloak
  username: keycloak
  existingSecret: keycloak-db
  existingSecretKey: password

dbchecker:
  enabled: true
  # The chart's default omits capabilities, which PodSecurity flags as
  # "unrestricted capabilities" under the restricted profile.
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]

extraEnv: |
  - name: KC_HOSTNAME
    value: https://keycloak.${BASE_DOMAIN}
  - name: KC_HOSTNAME_STRICT
    value: "false"
  # MUST stay false. When true, Keycloak derives backchannel URLs from the
  # incoming request -- and ingress-nginx terminates TLS, so the request
  # reaches Keycloak over plain HTTP. The discovery document then advertises
  # token_endpoint and userinfo_endpoint as http:// while issuer and
  # authorization_endpoint stay https://. Clients that follow discovery get
  # a 308 from ingress on the token call; OIDC libraries do not follow
  # redirects on POST, so the exchange fails with an unhelpful parse error.
  # false makes every advertised endpoint use KC_HOSTNAME.
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "false"
  # KC_HTTP_ENABLED / KC_HEALTH_ENABLED / KC_METRICS_ENABLED are set by the
  # chart from proxy.http.enabled / health.enabled / metrics.enabled -- setting
  # them here too produces duplicate env entries and a failed apply.
  - name: KC_LOG_LEVEL
    value: info
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-bootstrap-admin
        key: username
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-bootstrap-admin
        key: password
  - name: JAVA_OPTS_APPEND
    # A hard ceiling holds Keycloak near 400 MiB; percentage-based sizing let
    # it reach 1.4 GiB. Raise both together if logins hit OutOfMemoryError.
    # Do NOT add a -XX:+Use*GC flag: these are appended to the image's own
    # JAVA_OPTS, which already picks one, and the JVM then refuses to start
    # with "Multiple garbage collectors selected".
    value: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m

extraVolumes: |
  - name: realm
    secret:
      secretName: keycloak-realm

extraVolumeMounts: |
  - name: realm
    mountPath: /opt/keycloak/data/import
    readOnly: true

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
  rules:
    - host: keycloak.${BASE_DOMAIN}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: keycloak-tls
      hosts:
        - keycloak.${BASE_DOMAIN}

resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { memory: 1Gi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

metrics:
  enabled: true
health:
  enabled: true

serviceMonitor:
  enabled: true
