---
# Minimal kind cluster: 1 control plane + 1 worker.
#
# Each apiserver holds ~2 GiB of watch cache over every object and CRD, so
# node count dominates this cluster's memory. One control plane therefore
# means no etcd quorum: nothing here survives a node loss. Deliberate.
#
#   - 1 control-plane node (NO etcd quorum) behind kind's HAProxy
#   - 1 worker, which also fronts ingress and publishes 80/443
#   - Secrets encrypted at rest in etcd
#   - OIDC (Keycloak) configured at kubeadm time, not patched in afterwards
#   - API audit logging, PodSecurity admission
#   - default CNI disabled; Calico is installed by scripts/cluster-up.sh
#
# Rendered by scripts/cluster-up.sh (envsubst) -> .build/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ${CLUSTER_NAME}

networking:
  ipFamily: ipv4
  apiServerAddress: "127.0.0.1"
  apiServerPort: ${API_SERVER_PORT}
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  # Calico does not replace kube-proxy.
  kubeProxyMode: "iptables"
  disableDefaultCNI: true

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiVersion: kubeadm.k8s.io/v1beta4
    apiServer:
      extraArgs:
        - name: audit-policy-file
          value: /etc/kubernetes/policies/audit-policy.yaml
        - name: audit-log-path
          value: /var/log/kubernetes/audit.log
        - name: audit-log-maxage
          value: "7"
        - name: audit-log-maxbackup
          value: "5"
        - name: audit-log-maxsize
          value: "100"
        - name: admission-control-config-file
          value: /etc/kubernetes/policies/admission-config.yaml
        - name: encryption-provider-config
          value: /etc/kubernetes/policies/encryption-config.yaml
        - name: encryption-provider-config-automatic-reload
          value: "true"
        - name: authentication-config
          value: /etc/kubernetes/policies/authentication-config.yaml
        - name: enable-admission-plugins
          value: NodeRestriction,PodSecurity,ResourceQuota,LimitRanger,ServiceAccount,DefaultStorageClass,PersistentVolumeClaimResize,DefaultIngressClass
        - name: request-timeout
          value: "300s"
      extraVolumes:
        - name: policies
          hostPath: /etc/kubernetes/policies
          mountPath: /etc/kubernetes/policies
          readOnly: true
          pathType: DirectoryOrCreate
        - name: audit-log
          hostPath: /var/log/kubernetes
          mountPath: /var/log/kubernetes
          readOnly: false
          pathType: DirectoryOrCreate
    etcd:
      local:
        extraArgs:
          - name: listen-metrics-urls
            value: http://0.0.0.0:2381
    controllerManager:
      extraArgs:
        - name: bind-address
          value: 0.0.0.0
    scheduler:
      extraArgs:
        - name: bind-address
          value: 0.0.0.0
  - |
    kind: KubeProxyConfiguration
    apiVersion: kubeproxy.config.k8s.io/v1alpha1
    # Default binds to 127.0.0.1, which Prometheus cannot reach.
    metricsBindAddress: 0.0.0.0:10249

nodes:
  # ---- control plane (single member: no quorum) ----
  - role: control-plane
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: ${POLICY_DIR}
        containerPath: /etc/kubernetes/policies
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            - name: node-labels
              value: "topology.kubernetes.io/region=kind-local,topology.kubernetes.io/zone=zone-a,workload=control-plane"

  # ---- worker ----
  # Keeps its taint-free status as the only schedulable node, fronts ingress,
  # and publishes 80/443 to the host.
  - role: worker
    image: ${NODE_IMAGE}
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            - name: node-labels
              value: "ingress-ready=true,topology.kubernetes.io/region=kind-local,topology.kubernetes.io/zone=zone-a,workload=general"
    extraPortMappings:
      - containerPort: 80
        hostPort: ${HTTP_PORT}
        protocol: TCP
      - containerPort: 443
        hostPort: ${HTTPS_PORT}
        protocol: TCP
