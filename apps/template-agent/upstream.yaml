apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: template-agent
    component: database
  name: pgvector
  namespace: template-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      component: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        component: database
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: agent-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: agent-secrets
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              key: POSTGRES_DB
              name: agent-config
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: pgvector/pgvector:pg16
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - pgvector
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: pgvector
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - pgvector
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
        - mountPath: /docker-entrypoint-initdb.d
          name: postgres-init
      restartPolicy: Always
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - configMap:
          name: postgres-init
        name: postgres-init
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: template-agent
    component: cache
  name: redis
  namespace: template-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      component: cache
  template:
    metadata:
      labels:
        component: cache
    spec:
      containers:
      - command:
        - redis-server
        - --appendonly
        - "no"
        - --save
        - 60 1
        - --maxmemory
        - 256mb
        - --maxmemory-policy
        - allkeys-lru
        image: redis:7-alpine
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: redis
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /data
          name: redis-data
      initContainers:
      - command:
        - sh
        - -c
        - |
          rm -rf /data/appendonlydir
          if [ -f /data/dump.rdb ]; then
            if redis-check-rdb /data/dump.rdb > /dev/null 2>&1; then
              echo "RDB file valid"
            else
              echo "RDB file corrupt — removing"
              rm -f /data/dump.rdb
            fi
          fi
        image: redis:7-alpine
        name: validate-rdb
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /data
          name: redis-data
      restartPolicy: Always
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
