---
# Whisker is Calico's network-flow UI (fed by Goldmane). Both ship with Calico
# 3.33 and are already running in calico-system -- this only exposes the UI on
# the platform ingress, behind the same Keycloak SSO as the other consoles.
#
# This is what replaces the flow visibility we would have had from Cilium's
# Hubble, which could not run under rootless podman.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whisker
  namespace: calico-system
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
    # Whisker serves TLS on 8443 with its own internal certificate.
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.identity.svc.cluster.local/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://auth.${BASE_DOMAIN}${URL_SUFFIX}/oauth2/start?rd=$scheme://$best_http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups
spec:
  ingressClassName: nginx
  tls:
    - secretName: whisker-tls
      hosts: ["flows.${BASE_DOMAIN}"]
  rules:
    - host: flows.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whisker
                port:
                  number: 8443
