---
# NVIDIA OpenShell: a gateway that provisions sandboxed agent workloads
# behind a brokered network boundary. Each sandbox is a supervisor pod plus a
# workload pod; the workload's egress rides back over the supervisor's
# outbound session, where policy decides what is allowed upstream.
#
# This only isolates anything because Calico enforces NetworkPolicy here.
# Kubernetes accepts NetworkPolicy objects whether or not the CNI implements
# them, so on a cluster running kindnet the sandbox boundary would be
# decorative. `make smoke` proves enforcement with a pod-to-pod test.

# Single replica, matching the rest of this platform. >1 needs an external
# Postgres via server.externalDbSecret; SQLite on a PVC is the simpler fit.
replicaCount: 1
workload:
  kind: statefulset

# Chart defaults leave the gateway tag empty, which resolves to the chart
# appVersion -- but the sandbox fallback image would float. Both are pinned
# so the disallow-latest-tag policy admits them and rebuilds are repeatable.
gateway:
  image:
    tag: "0.1.7"

sandbox:
  image:
    repository: nvcr.io/nvidia/base/ubuntu
    tag: "24.04"

server:
  logLevel: info
  # Sandboxes land in their own namespace so tenant policy and quotas apply
  # to them rather than to the gateway.
  sandboxNamespace: openshell-sandboxes
  dbUrl: "sqlite:/var/openshell/openshell.db"
  dataStorageSize: 1Gi
  dataStorageClass: standard
  auth:
    # Never true here. The gateway is reachable in-cluster, and an
    # unauthenticated gateway that can start pods is a cluster-wide hole.
    allowUnauthenticatedUsers: false
  # The gateway serves its own TLS and the ingress passes the connection
  # through untouched, so this stays false.
  disableTls: false
  # Users authenticate with Keycloak, the same identity provider as every
  # other console here. This is the kind equivalent of the pass-through
  # Route in NVIDIA's OpenShift guide: a proxy cannot present a client
  # certificate on a user's behalf, so an exposed gateway has to move from
  # mTLS to OIDC.
  oidc:
    issuer: https://keycloak.${BASE_DOMAIN}${URL_SUFFIX}/realms/platform
    # The API resource server's audience, not the CLI's client id -- they
    # happen to be the same string because the CLI client carries an
    # audience mapper that names itself. Keycloak omits `aud` otherwise and
    # every request fails validation.
    audience: openshell-cli
    # RBAC rather than authenticate-only: with both role names empty the
    # gateway treats everyone who can log in as a Platform Admin. These
    # realm roles are created and bound to the platform groups by
    # scripts/identity.sh.
    rolesClaim: realm_access.roles
    adminRole: openshell-admin
    userRole: openshell-user
    # Keycloak is served from the platform CA, which is not in the
    # gateway's trust store. Without this the JWKS fetch fails and every
    # token is rejected. platform-install.sh puts this ConfigMap in the
    # namespace.
    caConfigMapName: platform-ca
  # Left false. Both settings fail here, for unrelated reasons -- measured,
  # not inferred (see docs/openshell.md):
  #
  #   true  -> hostUsers: false, and the kubelet cannot create the pod at
  #            all: "failed to create network namespace: failed to set
  #            effective UID: invalid argument". This one really is rootless
  #            podman: the node's own uid_map is 0->501 and 1->100000, the
  #            kubelet runs with KubeletInUserNamespace=true, and a pod
  #            mapping cannot be carved out of a range the runtime does not
  #            own.
  #
  #   false -> the supervisor starts and dies with "failed to spawn sandbox
  #            entrypoint process: Permission denied". NOT a rootless-podman
  #            limitation. A probe pod with the same security posture
  #            (non-root, all capabilities dropped) shows Landlock (ABI v9)
  #            and seccomp user-notification both working, and
  #            unshare(CLONE_NEWUSER) returning EPERM under RuntimeDefault
  #            but succeeding under Unconfined. The blocker is containerd's
  #            default seccomp profile, which denies CLONE_NEWUSER to
  #            containers without CAP_SYS_ADMIN. The chart offers no way to
  #            change the sandbox pods' profile.
  #
  # false is still the better failure: it fails inside a pod that policy
  # already constrains, rather than in the kubelet.
  #
  # The gateway itself is fine; only its sandbox provisioning is blocked.
  # The agent's built-in tool therefore drives Agent Sandbox directly, which
  # works because those pods neither set hostUsers nor need a user namespace.
  enableUserNamespaces: false
  tls:
    # Off, deliberately. The gateway is reached through ingress now, and
    # an ingress cannot present a client certificate for the user -- so
    # user authentication moves to OIDC above. Supervisor-to-gateway
    # traffic still rides the chart CA's internal server certificate.
    enableMtls: false

# certManager owns TLS; the chart falls back to a JWT-only certgen hook for
# the sandbox token signing key, which cert-manager does not manage.
pkiInitJob:
  enabled: true

certManager:
  enabled: true
  # A second server certificate, issued by the platform CA for the external
  # hostname only. The internal certificate stays signed by the chart's own
  # CA, which is what the supervisor and the client CA mount expect.
  serverIssuerRef:
    name: platform-ca
    kind: ClusterIssuer
    group: cert-manager.io
  # Only the ingress hostname: this list is the SAN set of that second
  # certificate, not an addition to the internal one.
  serverDnsNames:
    - openshell.${BASE_DOMAIN}

service:
  type: ClusterIP
  port: 8080

# Required: a ResourceQuota is in force and Kyverno rejects pods without
# requests. These are starting points, not measurements.
resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { memory: 768Mi }

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

rbac:
  create: true
  clusterScoped:
    create: true

serviceAccount:
  create: true
