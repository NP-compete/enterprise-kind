---
# RBAC letting the agent create and exec into Sandboxes for its built-in
# openshell_run_code tool.
#
# Separate from the template-agent Application because that one sets
# `namespace: template-agent` in its kustomization, which rewrites every
# namespaced resource -- these bindings must stay in openshell-sandboxes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: template-agent-rbac
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Literal, not ${GITOPS_REPO}: only root-app.yaml is rendered locally by
    # gitops-bootstrap. Child Applications are read straight from git by
    # Argo CD, where nothing expands variables.
    repoURL: https://github.com/NP-compete/enterprise-kind.git
    targetRevision: HEAD
    path: apps/template-agent-rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: openshell-sandboxes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The namespace must stay a policed tenant: no platform exemption
      # label, so Kyverno applies to these workloads in full.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
