---
args:
  # kind kubelets serve a self-signed cert that metrics-server cannot chain to the cluster CA.
  - --kubelet-insecure-tls
  - --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
  - --metric-resolution=15s
replicas: 1
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 256Mi }
metrics:
  enabled: true
serviceMonitor:
  enabled: true
