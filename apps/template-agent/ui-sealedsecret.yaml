---
# The UI will not start without COOKIE_SIGN, and Argo CD can only apply what
# is in git -- so the value is committed here encrypted. Only the
# sealed-secrets controller's private key (in kube-system, backed up by
# Velero) can decrypt it; the ciphertext is useless to anyone else.
#
# Reseal after `make reset`, which mints a new controller key:
#   kubectl -n template-agent create secret generic ui-secrets \
#     --from-literal=COOKIE_SIGN="$(cat .secrets/ui-cookie-sign)" \
#     --dry-run=client -o yaml | make seal > apps/template-agent/ui-sealedsecret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ui-secrets
  namespace: template-agent
spec:
  encryptedData:
    COOKIE_SIGN: 
  template:
    metadata:
      name: ui-secrets
      namespace: template-agent
