---
# Reference workload: what "production-shaped" looks like on this platform.
# Restricted PodSecurity, requests+limits, both probes, PDB, HPA, anti-affinity
# across zones, ServiceMonitor, and TLS ingress from the platform CA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: apps
  labels: &labels
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/part-of: demo
    owner: platform-team
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: podinfo
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: PODINFO_UI_COLOR
              value: "#34577c"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: podinfo
          # The image has no ENTRYPOINT (Cmd=[./podinfo]), so `args` alone
          # replaces the command and the container tries to exec
          # "--port=9898". The command has to be stated explicitly.
          command: ["./podinfo"]
          args:
            - --port=9898
            - --level=info
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: apps
  labels:
    app.kubernetes.io/name: podinfo
spec:
  selector:
    app.kubernetes.io/name: podinfo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: podinfo
  namespace: apps
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: podinfo
  namespace: apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podinfo
  namespace: apps
  labels:
    app.kubernetes.io/name: podinfo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: networking.k8s.io/v1
# NOTE: literal hostname, not ${BASE_DOMAIN}.
# Everything under apps/ is read directly from git by Argo CD, which does
# not run envsubst -- a placeholder here becomes the literal hostname
# "podinfo.${BASE_DOMAIN}", which is not a valid DNS name and the Ingress
# is rejected. Only platform/manifests/ is rendered by platform-install.sh.
# Change BASE_DOMAIN in config.env and these have to be updated too.
kind: Ingress
metadata:
  name: podinfo
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
spec:
  ingressClassName: nginx
  tls:
    - secretName: podinfo-tls
      hosts: ["podinfo.kind.test"]
  rules:
    - host: podinfo.kind.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo
                port:
                  number: 80
