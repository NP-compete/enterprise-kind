---
# Maps Keycloak groups to Kubernetes RBAC. The `oidc:` prefix comes from the
# API server's authentication config and keeps SSO identities in their own
# namespace, so they can never collide with ServiceAccounts or the cert-based
# kubernetes-admin used by kubectl.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-platform-admins
  labels:
    platform.kind.local/component: sso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: "oidc:platform-admins"
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-platform-viewers
  labels:
    platform.kind.local/component: sso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: "oidc:platform-viewers"
    apiGroup: rbac.authorization.k8s.io
---
# `view` deliberately excludes Secrets and grants nothing cluster-scoped.
# Give viewers read access to nodes and other cluster resources so the
# Headlamp dashboard is not full of permission errors.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc-cluster-reader
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes, events]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-platform-viewers-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oidc-cluster-reader
subjects:
  - kind: Group
    name: "oidc:platform-viewers"
    apiGroup: rbac.authorization.k8s.io
